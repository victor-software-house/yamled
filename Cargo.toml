[package]
name = "yamled"
version = "0.0.5"
edition = "2024"
rust-version = "1.97.1"
description = "Format-preserving YAML edits: change what you meant, keep every other byte"
license = "MIT"
repository = "https://github.com/victor-software-house/yamled"
keywords = ["yaml", "edit", "format-preserving", "comments", "lossless"]
categories = ["parser-implementations", "encoding"]
exclude = ["tests/yaml-test-suite"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde-saphyr"]

[dependencies]
granit-parser = "1.3.0"
serde = { version = "1.0.228", default-features = false, features = [
  "std",
], optional = true }
serde-saphyr = { version = "1.3.0", default-features = false, features = [
  "serialize",
  "deserialize",
], optional = true }

[dev-dependencies]
indoc = "2.0.7"
insta = { version = "1.48.0", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = [
  "std",
] }
similar = { version = "3.2.0", default-features = false, features = ["text"] }

[[test]]
name = "edits"
required-features = ["serde"]

[[test]]
name = "workflows"
required-features = ["serde"]

[[test]]
name = "corpus"
required-features = ["serde"]

[[test]]
name = "properties"
required-features = ["serde"]

[package.metadata.docs.rs]
all-features = true
