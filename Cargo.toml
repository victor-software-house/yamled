[package]
name = "yamled"
version = "0.0.11"
edition = "2024"
rust-version = "1.99.1"
description = "Format-preserving YAML edits: change what you meant, keep every other byte"
license = "MIT"
repository = "https://github.com/victor-software-house/yamled"
keywords = ["yaml", "edit", "format-preserving", "comments", "lossless"]
categories = ["parser-implementations", "encoding"]
exclude = ["tests/yaml-test-suite"]

[lints.rust]
# deny instead of forbid, because forbid refuses the item-level
# #[expect(unsafe_code, reason = "...")] that a justified exception carries.
unsafe_code = "deny"
# Each unsafe operation inside an unsafe fn sits in its own unsafe block.
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"
# Allow-by-default, so a -D warnings rustdoc build never fires it: an unbalanced
# backtick renders the rest of the paragraph as code.
unescaped_backticks = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# A function that returns Result reports failure through it instead of a panic.
panic_in_result_fn = "deny"
# map_err(|_| ...) drops the cause; wrap it as a source instead. A site whose
# error carries nothing carries #[expect(clippy::map_err_ignore, reason = "...")].
map_err_ignore = "deny"
# `format!` or `push_str` instead of `+` on a String.
string_add = "deny"
# From and TryFrom instead of as, which can silently truncate or wrap. A site
# that truly needs as carries #[expect(clippy::as_conversions, reason = "...")].
as_conversions = "deny"
# Rc<str> and Rc<[T]> instead of Rc<String> or Rc<Vec<T>>.
rc_buffer = "deny"
# Rc::clone(&x), so a cheap pointer clone reads apart from a deep copy.
clone_on_ref_ptr = "deny"
# Every unsafe block carries a // SAFETY: comment and holds one unsafe
# operation, so each comment justifies exactly one call.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# foo.rs beside foo/, never foo/mod.rs. The Rust Book calls foo.rs the
# idiomatic path and mod.rs the older style (ch07-05, "Alternate File Paths").
# Many files named mod.rs blur together in an editor.
mod_module_files = "deny"
# A library logs through tracing or log; printing is the binary's choice.
print_stdout = "deny"
print_stderr = "deny"
# Duplicate versions come from transitive dependencies the crate does not
# control; cargo-deny reports them (`bans.multiple-versions`).
multiple_crate_versions = "allow"

# The smallest binary that keeps its speed. Against opt-level 3 with thin LTO,
# a ctl CLI came out 35% smaller and 4% slower.
#
# opt-level "z" takes another 25% off but runs a ledger parse 51% slower. A
# repository whose run time does not matter sets it here. Cargo ignores the
# profiles of a dependency, so a library's consumers see none of this.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Line tables keep backtraces readable at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde-saphyr"]

[dependencies]
granit-parser = "2.0.0"
serde = { version = "1.0.228", default-features = false, features = [
  "std",
], optional = true }
# serde-saphyr 2.1.1 with two patches, under its own library name: its
# deserializer no longer formats a whole error report, snippet renderer
# included, to tell two errors apart or to fill an alias error's message.
# Drop the fork when upstream does the same.
serde-saphyr = { package = "vsh-serde-saphyr", version = "=0.0.3", default-features = false, features = [
  "serialize",
  "deserialize",
], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
] }
indoc = "2.0.7"
insta = { version = "1.48.0", default-features = false }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = [
  "std",
] }
similar = { version = "3.2.0", default-features = false, features = ["text"] }

[[test]]
name = "edits"
required-features = ["serde"]

[[test]]
name = "workflows"
required-features = ["serde"]

[[test]]
name = "corpus"
required-features = ["serde"]

[[test]]
name = "properties"
required-features = ["serde"]

[[bench]]
name = "render"
harness = false
required-features = ["serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cap-lints", "warn"]
