[package]
name = "yamled"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "Format-preserving YAML edits: change what you meant, keep every other byte"
license = "MIT"
repository = "https://github.com/victor-software-house/yamled"
keywords = ["yaml", "edit", "format-preserving", "comments", "lossless"]
categories = ["parser-implementations", "encoding"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_codeblock_attributes = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
disallowed_macros = "deny"

[dependencies]
granit-parser = "1.3.0"
serde = { version = "1.0.228", default-features = false, features = ["std"] }
serde-saphyr = "1.3.0"

[dev-dependencies]
indoc = "2.0.7"
serde = { version = "1.0.228", features = ["derive"] }
