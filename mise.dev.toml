# Loaded when MISE_ENV contains `dev` (local default via .miserc.toml).
# Compile this checkout. Not used by Version PR.

# mr_boxington on the rust entry needs mise 2026.9.2 or newer.
min_version = "2026.9.2"

[tools]
committed = "1.1.11"
lefthook = "2.1.10"
rust = { version = "nightly-2026-09-29", components = "rustfmt,clippy", mr_boxington = true }
mr-boxington = "1.20.0"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
bun = "1.4.2"
taplo = "0.10.0"
rumdl = "0.2.77"
typos = "1.50.3"
actionlint = "1.7.12"
"npm:@fission-ai/openspec" = "1.13.2"

# mise sets RUSTUP_TOOLCHAIN; without it, rustc resolves rust-toolchain.toml.
[tasks."check:toolchain"]
description = "mise.dev.toml and rust-toolchain.toml pin the same toolchain"
run = '[ "$(rustc -V)" = "$(env -u RUSTUP_TOOLCHAIN RUSTUP_AUTO_INSTALL=0 rustc -V)" ] || { echo "✘ mise.dev.toml and rust-toolchain.toml pin different toolchains"; exit 1; }'

[tasks.format]
description = "rustfmt check"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "clippy -D warnings"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks."check:features"]
description = "Lint the crate and its tests without the serde feature"
run = "cargo clippy --no-default-features --all-targets -- -D warnings"

[tasks.test]
description = "Unit, integration, and doc-tests"
run = "cargo test --all-features"
# Stops a hung test run instead of holding the gate. The limit also counts
# compile time and waits on the target/ lock, so it sits far above a cold build.
timeout = "30m"

[tasks.snapshots]
description = "Review and accept changed snapshots"
tools = { "github:mitsuhiko/insta" = { version = "1.48.0", exe = "cargo-insta" } }
run = "cargo insta review"

[tasks.deny]
description = "License, ban, and source policy (offline)"
run = "cargo deny check licenses bans sources"

[tasks."deny:advisories"]
description = "RustSec advisories and yanked crates (network)"
run = "cargo deny check advisories"

[tasks.deps]
description = "Unused crate analysis"
run = "cargo-machete --with-metadata"

[tasks.commit-msg]
description = "Lint the git commit-msg file with committed"
usage = 'arg "<file>" help="Path to the commit message file"'
run = 'committed --commit-file "${usage_file}"'

[tasks.commits]
description = "Lint commit messages with committed"
usage = 'arg "[commits]" default="HEAD" help="Commit or range"'
run = 'committed "${usage_commits}"'

[tasks."format:toml"]
description = "TOML formatting check"
run = "taplo fmt --check"

[tasks."lint:md"]
description = "Markdown lint"
run = "rumdl check ."

[tasks."lint:typos"]
description = "Spelling in code, docs, and commit-bound text"
run = "typos"

[tasks."lint:workflows"]
description = "GitHub Actions workflow lint"
run = "actionlint"

[tasks.specs]
description = "Validate every OpenSpec change and spec"
run = "openspec validate --all --strict"

[tasks.verify]
description = "Format, lint (Rust, TOML, Markdown, spelling, workflows), feature sets, tests, deny, unused crates, OpenSpec"
depends = [
  "check:toolchain",
  "format",
  "format:toml",
  "lint",
  "lint:md",
  "lint:typos",
  "lint:workflows",
  "check:features",
  "test",
  "deny",
  "deps",
  "specs",
]
