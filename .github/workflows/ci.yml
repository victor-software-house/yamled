name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # A check:versions task reads a pull request that changes a manifest
  # version, to tell the Version PR apart from a hand edit.
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event.pull_request.base.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # The shared workflow runs verify, picks the runner from this repository's
  # visibility, and caches builds with mbx.
  verify:
    uses: victor-software-house/actions/.github/workflows/rust-ci.yml@a373f0f3d1c4194c63023536c0d7cc80c116bba8 # main, 2026-10-19
    with:
      mise-version: 2026.10.9
      advisories: true
      semver: true
