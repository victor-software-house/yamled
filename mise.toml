# The latest stable mise is the floor; CI pins the same version.
min_version = "2026.10.3"

[settings]
# mise loads git:: task includes only in experimental mode.
experimental = true
lockfile = true
npm.package_manager = "bun"

# Every tool this root declares must match mise.lock or mise.<env>.lock.
[tool_config]
locked = true

# The toolchain lives here, not in mise.dev.toml, because CI loads only
# MISE_ENV=ci. The stable pin equals rust-toolchain.toml and rust-version.
[tools]
rust = [
  # Pinned stable: build, lint, test.
  { version = "1.99.0", components = "clippy", mr_boxington = true },
  # Formatting only, for rustfmt's unstable options.
  { version = "nightly-2026-09-29", profile = "minimal", components = "rustfmt" },
]
mr-boxington = "1.20.0"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
"github:bnjbvr/cargo-machete" = "0.9.2"
"github:obi1kenobi/cargo-semver-checks" = "0.51.0"
jq = "1.8.2"
# The tools above come from the Copier template; the ones below are yamled's.
bun = "1.4.2"
# openspec (npm) runs on node.
node = "24.21.0"
taplo = "0.10.0"
rumdl = "0.2.77"
typos = "1.50.3"
actionlint = "1.7.12"
"npm:@fission-ai/openspec" = "1.13.2"

[task_config]
includes = [
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=v0.4.4",
  # The standard Rust tasks, shared from ctl-core. Bump the ref together with
  # the rust pins above.
  "git::https://github.com/victor-software-house/ctl-core.git//tasks/rust.toml?ref=v0.6.14",
]

# The YAML test suite submodule: `mise run` and `mise x` check it out when
# .gitmodules changes or the directory is missing.
[deps.git-submodule]
auto = true

# check:toolchain, format, lint, test, test:doc, deny, deny:advisories, deps,
# and semver come from ctl-core's tasks/rust.toml.

[tasks."check:features"]
description = "Lint the crate and its tests without the serde feature"
run = "cargo clippy --no-default-features --all-targets -- -D warnings"

[tasks.snapshots]
description = "Review and accept changed snapshots"
tools = { "github:mitsuhiko/insta" = { version = "1.48.0", exe = "cargo-insta" } }
run = "cargo insta review"

[tasks."format:toml"]
description = "TOML formatting check"
run = "taplo fmt --check"

[tasks."lint:md"]
description = "Markdown lint"
run = "rumdl check ."

[tasks."lint:typos"]
description = "Spelling in code, docs, and commit-bound text"
run = "typos"

[tasks."lint:workflows"]
description = "GitHub Actions workflow lint"
run = "actionlint"

[tasks.specs]
description = "Validate every OpenSpec change and spec"
run = "openspec validate --all --strict"

# The shared verify depends on check:repo for this repository's own checks.
[tasks."check:repo"]
description = "TOML format, Markdown, spelling, workflows, OpenSpec"
depends = ["format:toml", "lint:md", "lint:typos", "lint:workflows", "specs"]
